name: Source health (weekly live check)

# Keeps the repo lively-updated: exercises real sources every week so
# dead origins surface as a failed run instead of silent rot.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build providers
        run: bun build.js

      - name: Live spot-checks
        run: LIVE=1 bun run test
